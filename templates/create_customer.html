<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer - AI Chatbot Platform</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 30px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { color: #667eea; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; }
        .checkbox-group { display: flex; gap: 20px; flex-wrap: wrap; }
        .checkbox-group label { display: flex; align-items: center; gap: 8px; font-weight: normal; }
        .checkbox-group input[type="checkbox"] { width: auto; }
        button { padding: 14px 30px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #5a6fd6; }
        .back-link { margin-top: 20px; display: inline-block; color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <h1>➕ Add New Customer</h1>
        <form method="POST">
            <div class="form-group">
                <label>Customer/Organization Name *</label>
                <input type="text" name="name" required placeholder="e.g., City General Hospital">
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="contact@hospital.com">
            </div>
            
            <div class="form-group">
                <label>Industry *</label>
                <select name="industry" required>
                    <option value="">Select Industry</option>
                    <option value="hospital">🏥 Hospital/Healthcare</option>
                    <option value="call_center">📞 Call Center</option>
                    <option value="police">👮 Police/Safety</option>
                    <option value="corporate">🏢 Corporate</option>
                    <option value="startup">🚀 Startup</option>
                    <option value="education">📚 Education</option>
                    <option value="real_estate">🏠 Real Estate</option>
                    <option value="ecommerce">🛒 E-commerce</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Website URL *</label>
                <input type="url" name="website_url" required placeholder="https://www.example.com">
                <small style="color: #666;">The chatbot will automatically crawl and learn from this website</small>
            </div>
            
            <div class="form-group">
                <label>Monthly Subscription Cost ($)</label>
                <input type="number" name="subscription_cost" value="99" min="0" step="0.01">
            </div>
            
            <div class="form-group">
                <label>Status</label>
                <select name="status">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Theme Color</label>
                <input type="color" name="theme_color" value="#007bff">
            </div>
            
            <div class="form-group">
                <label>Features</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="appointment_booking" checked> Appointment Booking</label>
                    <label><input type="checkbox" name="contact_sharing" checked> Contact Sharing</label>
                    <label><input type="checkbox" name="live_chat"> Live Chat Escalation</label>
                    <label><input type="checkbox" name="multilingual"> Multi-language Support</label>
                </div>
            </div>
            
            <button type="submit">Create Customer & Deploy Chatbot</button>
        </form>
        <a href="/admin/customers" class="back-link">← Back to Customers</a>
    </div>
</body>
</html>
