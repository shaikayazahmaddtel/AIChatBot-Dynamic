<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center}
        .box{background:white;padding:40px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:400px;max-width:90%}
        h1{text-align:center;color:#667eea;margin-bottom:10px}
        p{text-align:center;color:#666;margin-bottom:30px}
        .form-group{margin-bottom:20px}
        label{display:block;margin-bottom:8px;color:#333;font-weight:600}
        input{width:100%;padding:14px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px}
        input:focus{outline:none;border-color:#667eea}
        button{width:100%;padding:15px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
        button:hover{transform:scale(1.02)}
        .error{background:#f8d7da;color:#721c24;padding:12px;border-radius:8px;text-align:center;margin-bottom:20px}
        .back{text-align:center;margin-top:20px}
        .back a{color:#667eea;text-decoration:none}
        .demo-info{margin-top:25px;padding:15px;background:#f0f0f0;border-radius:10px;font-size:14px;text-align:center}
    </style>
</head>
<body>
    <div class="box">
        <h1>👨‍💼 Admin Login</h1>
        <p>AI Chatbot Platform</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST" action="/admin/login">
            <div class="form-group"><label>Username</label><input type="text" name="username" required value="admin"></div>
            <div class="form-group"><label>Password</label><input type="password" name="password" required value="admin123"></div>
            <button type="submit">🔐 Login</button>
        </form>
        <div class="back"><a href="/">← Back to Home</a></div>
        <div class="demo-info"><strong>🔑 Demo:</strong> admin / admin123</div>
    </div>
</body>
</html>
