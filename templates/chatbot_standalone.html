<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ customer.name }} - Chatbot</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;background:#f7f7f8}
        .chat-header{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:15px 25px;font-weight:bold;font-size:1.1em;display:flex;align-items:center;gap:10px}
        .chat-messages{flex:1;overflow-y:auto;padding:25px}
        .message{margin-bottom:15px;padding:12px 18px;border-radius:15px;max-width:80%;word-wrap:break-word;font-size:14px;line-height:1.5;animation:slideIn .3s ease}
        @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .message-user{background:linear-gradient(135deg,#667eea,#764ba2);color:white;margin-left:auto;border-bottom-right-radius:5px}
        .message-bot{background:white;color:#333;border-bottom-left-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,.05)}
        .chat-input-area{padding:15px 25px;background:white;border-top:1px solid #e0e0e0;display:flex;gap:10px}
        .chat-input-area input{flex:1;padding:12px 18px;border:2px solid #e0e0e0;border-radius:25px;font-size:14px;outline:none}
        .chat-input-area input:focus{border-color:#667eea}
        .chat-input-area button{padding:12px 25px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:25px;cursor:pointer;font-weight:600}
    </style>
</head>
<body>
    <div class="chat-header">🤖 {{ customer.name }} - AI Assistant</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message message-bot">{{ config.welcome_message if config else 'Hello! How can I help you?' }}</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
    <script>
        const CUSTOMER_ID='{{ customer.id }}';
        const API_URL=window.location.origin+'/api/v1/chatbot/'+CUSTOMER_ID+'/chat';
        let sessionId=localStorage.getItem('session_'+CUSTOMER_ID)||'session_'+Math.random().toString(36).substr(2,9);
        localStorage.setItem('session_'+CUSTOMER_ID,sessionId);
        
        async function sendMessage(){
            const input=document.getElementById('chatInput');
            const message=input.value.trim();
            if(!message)return;
            addMessage('user',message);
            input.value='';
            try{
                const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,message:message})});
                const data=await res.json();
                addMessage('bot',data.response||'Sorry, error occurred.');
            }catch(e){addMessage('bot','Connection error.');}
        }
        function addMessage(type,text){
            const div=document.createElement('div');
            div.className='message message-'+type;
            div.textContent=text;
            document.getElementById('chatMessages').appendChild(div);
            document.getElementById('chatMessages').scrollTop=document.getElementById('chatMessages').scrollHeight;
        }
    </script>
</body>
</html>
