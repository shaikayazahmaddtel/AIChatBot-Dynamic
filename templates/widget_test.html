<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic AI Widget Test</title>
</head>
<body>
    <main style="max-width:900px;margin:60px auto;font-family:Arial,sans-serif;padding:24px;">
        <h1>Dynamic AI Widget Test</h1>
        <p>This test page intentionally contains no customer-specific answers or static chatbot responses.</p>
        <p>Provide a real registered customer ID through the query string to test the centralized tenant flow.</p>
    </main>
    <script src="/static/js/dynamic-ai.js"></script>
    <script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var customerId = params.get("customerId");
        if (!customerId) return;
        window.DynamicAI.init({ customerId: customerId });
    })();
    </script>
</body>
</html>
