<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title id="page-title">AI Assistant</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f8fafc;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --assistant: #e5e7eb;
      --assistant-text: #111827;
      --primary: #2563eb;
      --input-bg: #ffffff;
      --input-text: #111827;
    }

    body[data-theme="dark"] {
      --bg: #111827;
      --panel: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: #374151;
      --assistant: #374151;
      --assistant-text: #f9fafb;
      --primary: #3b82f6;
      --input-bg: #1f2937;
      --input-text: #f9fafb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background-color .2s ease, color .2s ease;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      background: var(--primary);
      color: #fff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .16);
      color: #fff;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
    }

    .icon-button:hover { background: rgba(255, 255, 255, .25); }
    .icon-button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    .messages {
      height: 490px;
      overflow: auto;
      padding: 16px;
      background: var(--panel);
      transition: background-color .2s ease;
    }

    .message {
      max-width: 85%;
      padding: 10px 12px;
      margin: 8px 0;
      border-radius: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: var(--primary);
      color: #fff;
    }

    .assistant {
      background: var(--assistant);
      color: var(--assistant-text);
    }

    .composer {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      transition: background-color .2s ease, border-color .2s ease;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: var(--input-bg);
      color: var(--input-text);
      outline: none;
    }

    textarea::placeholder { color: var(--muted); }
    textarea:focus { border-color: var(--primary); }

    #send {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
    }

    #send:hover { filter: brightness(.95); }
    #send:disabled { opacity: .55; cursor: not-allowed; }

    .meta {
      padding: 4px 16px 10px;
      font-size: 11px;
      color: var(--muted);
      min-height: 18px;
      background: var(--bg);
      transition: background-color .2s ease, color .2s ease;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title" id="widget-title">AI Assistant</div>
    <div class="header-actions">
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">☾</button>
      <button id="close" class="icon-button" type="button" aria-label="Close chatbot" title="Close chatbot">×</button>
    </div>
  </div>

  <div id="messages" class="messages"></div>
  <div class="meta" id="source"></div>

  <div class="composer">
    <textarea id="input" placeholder="Ask a question..."></textarea>
    <button id="send" type="button">Send</button>
  </div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var token = params.get("token");
  var apiBase = window.location.origin;
  var sessionId = null;
  var messages = document.getElementById("messages");
  var profile = null;
  var themeToggle = document.getElementById("theme-toggle");
  var input = document.getElementById("input");
  var sendButton = document.getElementById("send");

  function applyTheme(theme) {
    var dark = theme === "dark";
    document.body.setAttribute("data-theme", dark ? "dark" : "light");
    themeToggle.textContent = dark ? "☀" : "☾";
    themeToggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    themeToggle.setAttribute("title", dark ? "Switch to light mode" : "Switch to dark mode");
    try { localStorage.setItem("dynamic-ai-theme", dark ? "dark" : "light"); } catch (e) {}
  }

  function initializeTheme() {
    var saved = null;
    try { saved = localStorage.getItem("dynamic-ai-theme"); } catch (e) {}

    if (saved === "light" || saved === "dark") {
      applyTheme(saved);
      return;
    }

    var prefersDark = false;
    try {
      prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    } catch (e) {}
    applyTheme(prefersDark ? "dark" : "light");
  }

  function addMessage(role, text) {
    if (!text) return;
    var node = document.createElement("div");
    node.className = "message " + role;
    node.textContent = text;
    messages.appendChild(node);
    messages.scrollTop = messages.scrollHeight;
  }

  async function loadConfig() {
    if (!token) return false;
    try {
      var response = await fetch(apiBase + "/api/v1/chatbot/widget/config", {
        headers: { "Authorization": "Bearer " + token }
      });
      var payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "Widget configuration failed");
      profile = payload;
      document.getElementById("widget-title").textContent = payload.title || payload.name || "AI Assistant";
      document.getElementById("page-title").textContent = payload.title || payload.name || "AI Assistant";
      addMessage("assistant", payload.greeting);
      return true;
    } catch (error) {
      console.error(error);
      addMessage("assistant", "The chatbot is temporarily unavailable.");
      return false;
    }
  }

  async function sendMessage() {
    var message = input.value.trim();
    if (!message || !token || sendButton.disabled) return;

    input.value = "";
    addMessage("user", message);
    sendButton.disabled = true;

    try {
      var response = await fetch(apiBase + "/api/v1/chatbot/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ session_id: sessionId, message: message })
      });
      var payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "Request failed");

      sessionId = payload.session_id;
      addMessage("assistant", payload.answer);
      document.getElementById("source").textContent = payload.answer_type === "website"
        ? "Based on indexed customer website information"
        : payload.answer_type === "general"
          ? "General information; not presented as customer-specific"
          : "";
    } catch (error) {
      addMessage("assistant", "Unable to process your request right now.");
      console.error(error);
    } finally {
      sendButton.disabled = false;
      input.focus();
    }
  }

  themeToggle.addEventListener("click", function () {
    var current = document.body.getAttribute("data-theme") || "light";
    applyTheme(current === "dark" ? "light" : "dark");
  });

  sendButton.addEventListener("click", sendMessage);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  document.getElementById("close").addEventListener("click", function () {
    window.parent.postMessage({ type: "DYNAMIC_AI_CLOSE" }, "*");
  });

  initializeTheme();
  loadConfig();
})();
</script>
</body>
</html>
