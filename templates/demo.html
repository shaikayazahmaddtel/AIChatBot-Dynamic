<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Demo - AI Chatbot</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh}
        .container{max-width:1200px;margin:0 auto;padding:40px 20px}
        .header{text-align:center;color:white;padding:60px 20px}
        .header h1{font-size:3em;margin-bottom:15px}
        .header p{font-size:1.2em;opacity:.9}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:25px;margin-top:40px}
        .card{background:white;padding:40px 30px;border-radius:20px;text-align:center;transition:all .3s;text-decoration:none;color:inherit;display:block;box-shadow:0 10px 30px rgba(0,0,0,.2)}
        .card:hover{transform:translateY(-10px);box-shadow:0 20px 50px rgba(0,0,0,.3)}
        .card .icon{font-size:4.5em;margin-bottom:20px}
        .card h3{color:#333;margin-bottom:10px;font-size:1.4em}
        .card p{color:#666;line-height:1.5;font-size:.95em}
        .back{text-align:center;margin-top:40px}
        .back a{color:white;text-decoration:none;font-weight:600;font-size:1.1em}
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>🎮 Choose Your Demo</h1><p>Select an industry to experience our AI chatbot in action</p></div>
        <div class="grid">
            {% for key, industry in industries.items() %}
            <a href="/demo/{{ key }}" class="card">
                <div class="icon">{{ industry.icon }}</div>
                <h3>{{ industry.name }}</h3>
                <p>{{ industry.description }}</p>
            </a>
            {% endfor %}
        </div>
        <div class="back"><a href="/">← Back to Home</a></div>
    </div>
</body>
</html>
